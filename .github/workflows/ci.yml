name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
      version:
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:tooling
      - run: npm audit --audit-level=high

  build:
    name: Build package
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-name: flow-extension-${{ github.sha }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run verify:extension
      - id: package
        run: npm run package:extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flow-extension-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Extension E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: flow-extension-${{ github.sha }}
          path: release/
      - run: node scripts/package-extension.mjs unpack
      - run: npm run test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-e2e-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  gate:
    name: PR gate
    if: ${{ always() }}
    needs: [quality, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every stage to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          test "$QUALITY" = success
          test "$BUILD" = success
          test "$E2E" = success
